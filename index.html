<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A clean task manager web app with local storage persistence."
    />
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app" aria-label="Task manager application">
      <header class="app-header">
        <p class="app-kicker">Daily Focus</p>
        <h1>Task Manager</h1>
        <p class="app-subtitle">Capture tasks, complete them, and keep progress saved automatically.</p>
      </header>

      <form id="taskForm" class="task-form" autocomplete="off">
        <label class="sr-only" for="taskInput">Task description</label>
        <input
          id="taskInput"
          name="task"
          type="text"
          maxlength="140"
          placeholder="Add a task..."
          required
        />
        <button type="submit">Add Task</button>
      </form>

      <section class="task-shell" aria-live="polite">
        <div class="task-meta">
          <p id="taskCounts">0 total | 0 completed | 0 remaining</p>
          <button id="clearCompletedBtn" type="button">Clear Completed</button>
        </div>

        <ul id="taskList" class="task-list" aria-label="Task list"></ul>
        <p id="emptyState" class="empty-state">No tasks yet. Add one to get started.</p>
      </section>
    </main>
  </body>
</html>
